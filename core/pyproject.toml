[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtl"
version = "0.1.0"
description = "Smart traffic light control with a Markov Decision Process"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]
api = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "httpx", "websockets", "matplotlib", "fastapi", "uvicorn[standard]"]

[tool.setuptools.packages.find]
include = ["mtl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
